apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-data-collection-pipeline
  labels:
    app: api-data-collection-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-data-collection-pipeline
  template:
    metadata:
      labels:
        app: api-data-collection-pipeline
    spec:
      containers:
        - name: api
          image: api-data-collection-pipeline:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-data-collection-pipeline
spec:
  selector:
    app: api-data-collection-pipeline
  ports:
    - port: 80
      targetPort: 8080
